  <noscript><p class="noscript">برای کار با «انبار» باید جاوااسکریپت مرورگر روشن باشد.</p></noscript>

  <!-- Sign in -->
  <main id="login" class="auth" hidden>
    <div class="auth-card">
      <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-warehouse"/></svg></span><span class="brand-name">انبار</span></div>
      <div>
        <h1>ورود به انبار</h1>
        <p class="muted">سفارش‌ها، انبار و تسویه با شرکت‌ها؛ همه در یک جا.</p>
      </div>
      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="login-username">نام کاربری</label>
          <input id="login-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required>
        </div>
        <div class="field">
          <label for="login-password">رمز عبور</label>
          <div class="input-wrap">
            <input id="login-password" name="password" type="password" autocomplete="current-password" dir="ltr" required>
            <button class="input-btn" type="button" data-reveal="login-password" aria-label="نمایش رمز عبور" aria-pressed="false"><svg class="icon"><use href="#i-eye"/></svg></button>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" type="submit">ورود</button>
      </form>
    </div>
  </main>

  <!-- First sign-in with a one-time password -->
  <main id="first-password" class="auth" hidden>
    <div class="auth-card">
      <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-key"/></svg></span><span class="brand-name">انبار</span></div>
      <div>
        <h1>رمز تازه بگذارید</h1>
        <p class="muted">با رمز موقت وارد شدید. برای ادامه یک رمز شخصی (دست‌کم ۸ نویسه) انتخاب کنید.</p>
      </div>
      <form id="first-password-form" class="form" novalidate>
        <input type="hidden" name="username" autocomplete="username" id="first-username">
        <div class="field">
          <label for="fp-current">رمز موقت</label>
          <input id="fp-current" name="current" type="password" autocomplete="current-password" dir="ltr" required>
        </div>
        <div class="field">
          <label for="fp-next">رمز جدید</label>
          <input id="fp-next" name="next" type="password" autocomplete="new-password" dir="ltr" minlength="8" required>
        </div>
        <div class="field">
          <label for="fp-repeat">تکرار رمز جدید</label>
          <input id="fp-repeat" name="repeat" type="password" autocomplete="new-password" dir="ltr" minlength="8" required>
        </div>
        <button class="btn btn-primary btn-lg" type="submit">ذخیره و ادامه</button>
        <button class="btn btn-ghost" type="button" data-logout>خروج</button>
      </form>
    </div>
  </main>

  <!-- The app -->
  <div id="shell" class="shell" hidden>
    <header class="side" id="side">
      <div class="side-head">
        <a class="brand" href="#/dashboard" aria-label="انبار، داشبورد"><span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-warehouse"/></svg></span><span class="brand-name">انبار</span></a>
        <div class="side-tools">
          <button class="icon-btn" type="button" data-palette aria-label="جستجو و رفتن سریع (Ctrl+K)"><svg class="icon"><use href="#i-search"/></svg></button>
          <span class="live-dot" id="live-dot" title="اتصال زنده" aria-hidden="true"></span>
        </div>
      </div>
      <button class="palette-trigger" type="button" data-palette>
        <svg class="icon"><use href="#i-search"/></svg><span>جستجوی کالا یا بخش…</span><kbd dir="ltr">Ctrl K</kbd>
      </button>
      <nav class="side-nav" id="side-nav" aria-label="بخش‌ها"></nav>
      <div class="side-foot">
        <a class="me-link" href="#/profile" id="me-link">
          <span class="avatar" id="me-avatar" aria-hidden="true"></span>
          <span class="me-text"><strong id="me-name"></strong><small id="me-role"></small></span>
        </a>
        <button class="icon-btn" type="button" data-logout aria-label="خروج"><svg class="icon"><use href="#i-logout"/></svg></button>
      </div>
    </header>
    <main class="main" id="main" tabindex="-1">
      <div class="view" id="view" aria-live="polite" aria-busy="false"></div>
    </main>
  </div>

  <!-- Side sheet for forms and details (filled by the views) -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title" closedby="any">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" type="button" data-close-sheet aria-label="بستن"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>

  <!-- Confirmation -->
  <dialog id="confirm" class="modal" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <form method="dialog" class="modal-inner">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text" class="muted"></p>
      <div class="modal-actions">
        <button class="btn" value="yes" id="confirm-yes"></button>
        <button class="btn btn-ghost" value="" autofocus>انصراف</button>
      </div>
    </form>
  </dialog>

  <!-- Quick search / go to (Ctrl+K) -->
  <dialog id="palette" class="palette" aria-label="جستجو و رفتن سریع" closedby="any">
    <div class="palette-box">
      <div class="palette-input">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="palette-input" type="search" placeholder="نام کالا، کد، لینک یا نام بخش…" autocomplete="off" aria-controls="palette-list" aria-autocomplete="list" role="combobox" aria-expanded="true">
        <kbd dir="ltr">Esc</kbd>
      </div>
      <ul id="palette-list" class="palette-list" role="listbox" aria-label="نتیجه‌ها"></ul>
    </div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
